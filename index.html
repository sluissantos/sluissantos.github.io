<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envio MQTT</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --fg:#1b2230; --muted:#667085; --line:#d9dee5; --accent:#1f6feb; --ok:#1a7f37; --err:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --card:#1a2029; --fg:#e8ecf2; --muted:#9aa4b2; --line:#2c3440; --accent:#4c8dff; --ok:#3fb950; --err:#ff6b6b; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; padding:16px; }
  main { max-width:560px; margin:0 auto; display:grid; gap:14px; }
  h1 { font-size:1.3rem; margin:4px 0; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:grid; gap:10px; }
  label { display:grid; gap:4px; font-size:.85rem; color:var(--muted); }
  input, textarea { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; width:100%; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; border:0; border-radius:6px; padding:9px 16px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin:0; font-size:.9rem; color:var(--muted); }
  #status .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
  #status.ok { color:var(--ok); } #status.ok .dot { background:var(--ok); }
  #status.err { color:var(--err); } #status.err .dot { background:var(--err); }
  #topicName { color:var(--muted); margin-left:auto; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; max-height:300px; overflow:auto; }
  li { font-size:.9rem; border-bottom:1px solid var(--line); padding-bottom:6px; word-break:break-word; }
  li small { color:var(--muted); display:block; }
</style>
</head>
<body>
<main>
  <h1>Envio MQTT</h1>

  <p id="status" class="row"><span class="dot"></span><span id="state">Conectando...</span><small id="topicName"></small></p>

  <section>
    <label>Mensagem <textarea id="msg" placeholder="Digite a mensagem"></textarea></label>
    <div class="row"><button id="send" disabled>Enviar</button></div>
  </section>

  <section>
    <strong>Mensagens no tópico</strong>
    <ul id="log"></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

// Broker de teste: credenciais públicas de propósito.
const CFG = {
  url: 'wss://8ee07f68d14341e282ad0f17e05ca521.s1.eu.hivemq.cloud:8884/mqtt',
  username: 'username',
  password: 'password',
  topic: 'aura/central/msg',
};

function setStatus(text, cls) {
  $('state').textContent = text;
  $('status').className = 'row ' + (cls || '');
}

function addLog(text, note) {
  const li = document.createElement('li');
  li.textContent = text;
  const s = document.createElement('small');
  s.textContent = new Date().toLocaleTimeString() + ' · ' + note;
  li.appendChild(s);
  $('log').prepend(li);
}

$('topicName').textContent = CFG.topic;

const client = mqtt.connect(CFG.url, {
  username: CFG.username, password: CFG.password,
  clientId: 'web-' + Math.random().toString(16).slice(2, 10),
  reconnectPeriod: 5000,
});
client.on('connect', () => {
  setStatus('Conectado', 'ok');
  $('send').disabled = false;
  client.subscribe(CFG.topic);
});
client.on('reconnect', () => setStatus('Reconectando...', 'err'));
client.on('error', err => setStatus('Erro: ' + err.message, 'err'));
client.on('close', () => { $('send').disabled = true; });
client.on('message', (t, payload) => addLog(payload.toString(), 'recebida em ' + t));

$('send').onclick = () => {
  const text = $('msg').value;
  if (!text || !client.connected) return;
  client.publish(CFG.topic, text, { qos: 1 }, err => {
    if (err) setStatus('Falha ao enviar: ' + err.message, 'err');
    else $('msg').value = '';
  });
};
</script>
</body>
</html>
