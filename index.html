<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envio MQTT</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --fg:#1b2230; --muted:#667085; --line:#d9dee5; --accent:#1f6feb; --ok:#1a7f37; --err:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --card:#1a2029; --fg:#e8ecf2; --muted:#9aa4b2; --line:#2c3440; --accent:#4c8dff; --ok:#3fb950; --err:#ff6b6b; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; padding:16px; }
  main { max-width:560px; margin:0 auto; display:grid; gap:14px; }
  h1 { font-size:1.3rem; margin:4px 0; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:grid; gap:10px; }
  label { display:grid; gap:4px; font-size:.85rem; color:var(--muted); }
  input, textarea { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; width:100%; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; border:0; border-radius:6px; padding:9px 16px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #status { font-size:.9rem; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  details summary { cursor:pointer; font-weight:600; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; max-height:300px; overflow:auto; }
  li { font-size:.9rem; border-bottom:1px solid var(--line); padding-bottom:6px; word-break:break-word; }
  li small { color:var(--muted); display:block; }
</style>
</head>
<body>
<main>
  <h1>Envio MQTT</h1>

  <section>
    <details id="cfg">
      <summary>Conexão</summary>
      <label>Broker <input id="host" value="8ee07f68d14341e282ad0f17e05ca521.s1.eu.hivemq.cloud"></label>
      <label>Porta WebSocket (TLS) <input id="port" type="number" value="8884"></label>
      <label>Usuário <input id="user" autocomplete="username" value="username"></label>
      <label>Senha <input id="pass" type="password" autocomplete="current-password" value="password"></label>
      <label>Tópico <input id="topic" value="aura/central/msg"></label>
    </details>
    <div class="row">
      <button id="connect">Conectar</button>
      <span id="status">Desconectado</span>
    </div>
  </section>

  <section>
    <label>Mensagem <textarea id="msg" placeholder="Digite a mensagem"></textarea></label>
    <div class="row"><button id="send" disabled>Enviar</button></div>
  </section>

  <section>
    <strong>Mensagens no tópico</strong>
    <ul id="log"></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fields = ['host', 'port', 'user', 'pass', 'topic'];
let client = null;

// Valores padrão no HTML (broker de teste); o que for editado fica salvo neste navegador.
try {
  const saved = JSON.parse(localStorage.getItem('mqttCfg') || '{}');
  fields.forEach(f => { if (saved[f]) $(f).value = saved[f]; });
  if (!saved.user) $('cfg').open = true;
} catch (e) { $('cfg').open = true; }

function saveCfg() {
  const cfg = {};
  fields.forEach(f => cfg[f] = $(f).value.trim());
  try { localStorage.setItem('mqttCfg', JSON.stringify(cfg)); } catch (e) {}
  return cfg;
}

function setStatus(text, cls) {
  $('status').textContent = text;
  $('status').className = cls || '';
}

function addLog(text, note) {
  const li = document.createElement('li');
  li.textContent = text;
  const s = document.createElement('small');
  s.textContent = new Date().toLocaleTimeString() + ' · ' + note;
  li.appendChild(s);
  $('log').prepend(li);
}

$('connect').onclick = () => {
  if (client) { const c = client; client = null; c.end(true); return; }
  const cfg = saveCfg();
  setStatus('Conectando...');
  client = mqtt.connect(`wss://${cfg.host}:${cfg.port}/mqtt`, {
    username: cfg.user, password: cfg.pass,
    clientId: 'web-' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 5000,
  });
  client.on('connect', () => {
    setStatus('Conectado', 'ok');
    $('connect').textContent = 'Desconectar';
    $('send').disabled = false;
    $('cfg').open = false;
    client.subscribe(cfg.topic);
  });
  client.on('message', (t, payload) => addLog(payload.toString(), 'recebida em ' + t));
  client.on('error', err => setStatus('Erro: ' + err.message, 'err'));
  client.on('close', () => {
    $('send').disabled = true;
    if (!client) { setStatus('Desconectado'); $('connect').textContent = 'Conectar'; }
    else setStatus('Reconectando...', 'err');
  });
};

$('send').onclick = () => {
  const text = $('msg').value;
  if (!text || !client) return;
  client.publish($('topic').value.trim(), text, { qos: 1 }, err => {
    if (err) setStatus('Falha ao enviar: ' + err.message, 'err');
    else $('msg').value = '';
  });
};
</script>
</body>
</html>
