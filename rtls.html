<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg:#12161a; --panel:#1a2025; --line:#262e35; --line2:#303a42; --line3:#3a444d;
    --fg:#e6eaed; --muted:#9aa6b0; --accent:#f5a524; --accent-bg:rgba(245,165,36,.10);
    --ok-bg:rgba(52,199,120,.18); --ok-fg:#7be8ab; --bad-bg:rgba(255,92,92,.18); --bad-fg:#ff9d9d;
    --sos:#c93c41; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:14px; display:flex; flex-direction:column; }
  button { font-family:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .mono { font-family:var(--mono); }
  .muted { color:var(--muted); }
  a { color:var(--accent); }

  header { flex-shrink:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; padding:16px; border-bottom:1px solid var(--line); }
  header .title { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 16px; }
  header .title small { font:400 12px var(--mono); color:var(--muted); }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.01em; }
  .pages { display:flex; gap:14px; font-size:13px; }
  .pages a { color:var(--muted); text-decoration:none; }
  .pages a:hover { color:var(--fg); }
  .pages a[aria-current] { color:var(--accent); }
  header .right { display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; }
  header .btns { display:flex; flex-wrap:wrap; gap:8px; }
  .conn { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .conn i { width:10px; height:10px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .conn.ok { color:var(--ok-fg); } .conn.ok i { background:var(--ok-fg); }
  .conn.err { color:var(--bad-fg); } .conn.err i { background:var(--bad-fg); }

  main { flex:1; min-height:0; padding:16px; display:grid; gap:20px; grid-template-columns:minmax(0,1fr); align-content:start; }
  .col { display:flex; flex-direction:column; gap:20px; min-width:0; }
  @media (max-width:1099px) {
    html, body { height:auto; min-height:100%; }
    #mapSec { order:-1; }   /* on a phone the map comes first */
  }
  @media (min-width:1100px) {
    main { padding:24px; grid-template-columns:320px minmax(0,1.7fr) minmax(0,1fr); align-content:stretch; }
    section, .col { min-height:0; }
    #listSec .scroll { flex:1 1 0; max-height:none; }
    #areaList { flex:0 1 auto !important; max-height:30% !important; }
    #tagsSec { flex:1 1 0; }
    #tagsSec .scroll { flex:1; max-height:none; }
    #resSec { flex:0 1 auto; max-height:34%; }
    .mapwrap { flex:1; height:auto; min-height:300px; }
  }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  h2 { margin:0; font-size:15px; font-weight:600; }
  h3.sub { margin:4px 0 0; font-size:12px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .headrow { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 12px; }
  .headrow small { font-size:12px; color:var(--muted); }
  .filter { height:36px; max-width:100%; padding:0 10px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line3); border-radius:6px; }

  .scroll { overflow-y:auto; max-height:420px; scrollbar-color:#3a444d #1a2025; display:flex; flex-direction:column; }
  .scroll > * { flex-shrink:0; }
  .tr { display:grid; column-gap:10px; align-items:center; min-height:48px; padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; width:100%; }
  button.tr { border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--fg); text-align:left; }
  button.tr:hover { background:#242c33; }
  .cols-area { grid-template-columns:44px minmax(0,1fr) auto; }
  .cols-sensor { grid-template-columns:44px 74px minmax(0,1fr); }
  .cols-res { grid-template-columns:60px 36px minmax(0,1fr); align-items:start; min-height:40px; }
  .t { display:flex; flex-direction:column; }
  .t b { font:400 12px var(--mono); }
  .t small { font-size:11px; color:var(--muted); }
  .cell-mono { font:400 12px var(--mono); }
  .cell-sub { display:flex; flex-direction:column; min-width:0; }
  .cell-sub small { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cell-sub b { font:400 12px var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .changed { box-shadow:inset 3px 0 0 var(--accent); }
  .group-head { position:sticky; top:0; z-index:1; display:flex; align-items:baseline; gap:8px; padding:12px 8px 6px; background:var(--panel); border-bottom:1px solid var(--line2); }
  .group-head b { font:500 13px var(--mono); color:var(--accent); }
  .group-head small { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .chip { display:inline-flex; align-items:center; justify-content:center; gap:4px; height:22px; padding:0 8px; border-radius:11px; font-size:11px; font-weight:600; letter-spacing:.03em; }
  .chip.ok { background:var(--ok-bg); color:var(--ok-fg); }
  .chip.bad { background:var(--bad-bg); color:var(--bad-fg); }
  .chip.na { background:var(--line2); color:var(--muted); }
  .pill { display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:10px; font-size:11px; font-weight:600; letter-spacing:.03em; white-space:nowrap; }
  .pill.base { background:rgba(245,165,36,.16); color:var(--accent); }
  .pill.grey { background:var(--line2); color:var(--muted); }

  .tagcard { border:1px solid var(--line2); border-radius:6px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; background:transparent; color:var(--fg); text-align:left; width:100%; }
  .tagcard + .tagcard { margin-top:6px; }
  .tagcard { cursor:pointer; }
  .tagcard:hover { background:#20272d; }
  .tagcard .kv .ghost { height:28px; margin-left:auto; font-size:12px; }
  .tagcard.on { border-color:var(--accent); background:var(--accent-bg); }
  .tagcard.stale { opacity:.55; }
  .tagcard .l1 { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
  .tagcard .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .tagcard .addr { font:500 14px var(--mono); margin-right:2px; }
  .tagcard .seen { margin-left:auto; font:400 12px var(--mono); color:var(--muted); }
  .kv { display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; font-size:12px; color:var(--muted); }
  .kv .it { display:inline-flex; align-items:center; gap:5px; }
  .kv b { font:400 12px var(--mono); color:var(--fg); }
  .kv b.bad { color:var(--bad-fg); }

  .tabs { display:flex; flex-wrap:wrap; gap:6px; }
  .tab { height:32px; padding:0 12px; border:1px solid var(--line2); border-radius:6px; background:transparent; color:var(--fg); font:500 13px var(--mono); }
  .tab:hover { background:#242c33; }
  .tab.on { border-color:var(--accent); background:var(--accent-bg); color:var(--accent); }
  .toggles { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); }
  .toggles label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; min-height:32px; }
  .toggles input { width:16px; height:16px; margin:0; accent-color:var(--accent); }
  .filter.small { height:32px; font-size:12px; padding:0 6px; margin-left:-6px; }
  .mapwrap { position:relative; height:60vh; min-height:280px; border:1px solid var(--line2); border-radius:6px; background:#0f1316; overflow:hidden; touch-action:none; }
  .mapwrap > #map { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .mapwrap .hint { position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted); pointer-events:none; }
  .mapwrap .zoom { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:6px; }
  .mapwrap .zoom button { width:36px; height:36px; border:1px solid var(--line3); border-radius:6px; background:rgba(26,32,37,.92); color:var(--fg); font:500 16px var(--mono); }
  .mapwrap .zoom button:hover { background:#2a333b; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; color:var(--fg); }
  .legend svg { vertical-align:-2px; margin-right:4px; }

  .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .inp { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line2); border-radius:6px; height:40px; padding:0 10px; width:100%; min-width:0; }
  .inp::placeholder { color:var(--muted); }
  .inp.mono { font-family:var(--mono); }
  .inp.up { text-transform:uppercase; letter-spacing:.08em; }
  .inp.up::placeholder { text-transform:none; letter-spacing:0; }
  .inp.bad { border-color:var(--bad-fg); }
  .field > .lab { font-size:12px; color:var(--muted); }
  .field .note { font-size:12px; color:var(--muted); line-height:1.4; }
  .opt { display:flex; align-items:center; gap:10px; min-height:40px; padding:0 12px; border-radius:6px; cursor:pointer; border:1px solid var(--line2); background:transparent; }
  .opt.on { border-color:var(--accent); background:var(--accent-bg); }
  .opt input { margin:0; width:16px; height:16px; accent-color:var(--accent); }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .pair.three { grid-template-columns:1fr 1fr 1fr; }
  .empty { margin:8px 0 0; font-size:13px; color:var(--muted); line-height:1.4; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  .send-wrap { display:flex; flex-direction:column; gap:8px; }
  .send-wrap > span { font-size:12px; color:var(--muted); line-height:1.4; }
  .send-wrap .warn { color:var(--accent); }
  .send-wrap .err { color:var(--bad-fg); white-space:pre-wrap; font:400 12px/1.5 var(--mono); }
  .send-row { display:flex; gap:8px; }
  .send { flex:1; height:48px; border:0; border-radius:6px; background:var(--accent); color:var(--bg); font-size:15px; font-weight:600; }
  .send:hover:not(:disabled) { background:#ffb936; }
  .send:disabled { opacity:.4; cursor:default; }
  .send.danger { background:var(--sos); color:#fff; }
  .send-row .ghost { height:48px; }
  .ghost { height:36px; padding:0 12px; border:1px solid var(--line3); border-radius:6px; background:transparent; color:var(--fg); font-size:13px; }
  .ghost:hover:not(:disabled) { background:#2a333b; }
  .ghost:disabled { opacity:.4; cursor:default; }
  .ghost.danger { border-color:var(--sos); color:var(--bad-fg); }
  .ghost.armed { background:var(--sos); color:#fff; border-color:var(--sos); }
  .res-msg { font-size:12px; line-height:1.45; overflow-wrap:anywhere; white-space:pre-wrap; }
  .res-msg.bad { color:var(--bad-fg); }
  .res-msg small { display:block; color:var(--muted); }

  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .overlay .back { position:absolute; inset:0; border:0; background:rgba(8,10,12,.72); cursor:default; }
  .dialog { position:relative; width:min(520px,100%); max-height:100%; overflow-y:auto; background:var(--panel); border:1px solid var(--line3); border-radius:10px; padding:20px; display:flex; flex-direction:column; gap:14px; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .dialog.wide { width:min(720px,100%); }
  .dialog h3 { margin:0; font-size:16px; font-weight:600; }
  .dialog .when { font-size:12px; color:var(--muted); }
  .dialog .top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .dialog .close { width:44px; height:44px; margin:-8px -8px 0 0; border:0; border-radius:6px; background:transparent; color:var(--fg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .dialog .close:hover { background:#2a333b; }
  .dialog .problem { font-size:12px; color:var(--bad-fg); line-height:1.4; }
  pre { margin:0; padding:16px; background:var(--bg); border:1px solid var(--line2); border-radius:6px; font:400 12px/1.6 var(--mono); color:#d7dde2; white-space:pre-wrap; overflow-wrap:anywhere; overflow-y:auto; min-height:0; max-height:60vh; }
  /* Map background (satellite, streets) for georeferenced areas */
  .mapwrap #leaf { position:absolute; inset:0; background:#0f1316; }
  .seg { display:inline-flex; border:1px solid var(--line2); border-radius:6px; overflow:hidden; margin-right:4px; }
  .seg button { height:32px; padding:0 12px; border:0; background:transparent; color:var(--fg); font-size:12px; }
  .seg button + button { border-left:1px solid var(--line2); }
  .seg button.on { background:var(--accent-bg); color:var(--accent); }
  .seg button:disabled { opacity:.4; cursor:default; }
  .leaflet-container { font-family:var(--sans); }
  .anc-label { display:flex; align-items:center; gap:4px; white-space:nowrap; font:500 11px var(--mono); color:#fff; text-shadow:0 0 3px #000, 0 0 2px #000; }
  .anc-label svg { flex-shrink:0; }
  .anc-label span { background:rgba(18,22,26,.85); color:var(--fg); border:1px solid var(--line3); border-radius:4px; padding:0 5px; font:500 12px var(--mono); text-shadow:none; }
  .leaflet-tooltip.tagtip { background:rgba(18,22,26,.85); color:var(--fg); border:1px solid var(--line3); box-shadow:none; font:500 12px var(--mono); padding:1px 6px; }
  .leaflet-tooltip.tagtip:before { display:none; }
  /* The open layers menu, in the page's colours: dark text on the dark page was unreadable */
  .leaflet-control-layers-expanded { background:var(--panel); color:var(--fg); border:1px solid var(--line3) !important; border-radius:6px; padding:8px 12px; font-size:13px; }
  .leaflet-control-layers-expanded label { color:var(--fg); }
  .leaflet-control-layers-expanded label span { display:inline-flex; align-items:center; gap:6px; min-height:28px; }
  .leaflet-control-layers-expanded input { accent-color:var(--accent); margin:0; }
  .leaflet-control-layers-separator { border-top-color:var(--line2) !important; }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>RTLS</h1>
    <nav class="pages" aria-label="Test pages"><a href="messaging.html">Messaging</a><a href="rtls.html" aria-current="page">RTLS</a><a href="devices.html">Devices</a><a href="firmware.html">Firmware</a></nav>
    <small id="siteName"></small>
  </div>
  <div class="right">
    <span class="btns">
      <button class="ghost" id="viewJson" type="button">Lists JSON</button>
      <button class="ghost" id="clearTracks" type="button">Clear tracks</button>
      <button class="ghost" id="exportRec" type="button" title="Download a page that replays the movement of every tag since this page opened (up to 1 h per tag)">Record .html</button>
    </span>
    <span class="conn" id="conn" role="status"><i></i><span id="connText">Connecting to broker...</span></span>
  </div>
</header>

<main>
  <section id="listSec" aria-labelledby="h-list">
    <div class="headrow">
      <h2 id="h-list">Sensor list</h2>
      <small>edit here, then send to the engine</small>
    </div>
    <h3 class="sub">Areas</h3>
    <div class="scroll" id="areaList"></div>
    <p class="empty" id="noAreas" hidden>No area yet.</p>
    <h3 class="sub">Sensors</h3>
    <div class="scroll" id="sensorList"></div>
    <p class="empty" id="noSensors" hidden>No sensor yet.</p>
    <div class="row">
      <button class="ghost" id="addArea" type="button">+ Area</button>
      <button class="ghost" id="addSensor" type="button">+ Sensor</button>
    </div>
    <div class="send-wrap">
      <span id="draftSummary"></span>
      <span class="warn" id="draftWarn" hidden></span>
      <span class="err" id="draftErr" hidden></span>
      <div class="send-row">
        <button class="send" id="sendLists" type="button">Send lists</button>
        <button class="ghost" id="discard" type="button">Discard</button>
      </div>
    </div>
  </section>

  <section id="mapSec" aria-labelledby="h-map">
    <div class="headrow">
      <h2 id="h-map">Map</h2>
      <div class="tabs" id="areaTabs" role="tablist" aria-label="Trilateration area"></div>
    </div>
    <div class="toggles">
      <span class="seg" role="group" aria-label="Background">
        <button type="button" id="mPlan">Plan</button><button type="button" id="mMap">Map</button>
      </span>
      <label><input type="checkbox" id="tTracks" checked> Tracks</label>
      <select class="filter small" id="trailLen" aria-label="Track length on the map">
        <option value="10">last 10 s</option>
        <option value="60">last 1 min</option>
        <option value="600">last 10 min</option>
      </select>
      <label><input type="checkbox" id="tEllipses" checked> Error ellipses</label>
      <label><input type="checkbox" id="tTruth" checked> Simulator truth</label>
      <label><input type="checkbox" id="tLabels" checked> Labels</label>
    </div>
    <div class="mapwrap" id="mapWrap">
      <svg id="map" aria-label="Map of the area"></svg>
      <div id="leaf" hidden></div>
      <div class="zoom">
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        <button type="button" id="zoomFit" aria-label="Fit the area" title="Fit">⤢</button>
      </div>
      <span class="hint" id="mapHint"></span>
    </div>
    <div class="legend">
      <span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1l5 9H1z" fill="none" stroke="#e6eaed" stroke-width="1.5"/></svg>anchor</span>
      <span><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" fill="#f5a524"/></svg>tag</span>
      <span><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" fill="none" stroke="#e6eaed" stroke-dasharray="2 2"/></svg>simulator truth</span>
      <span title="The engine declines positions more than 2 m outside it"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="#e6eaed" stroke-dasharray="3 2"/></svg>area boundary</span>
      <span id="gridNote"></span>
    </div>
  </section>

  <div class="col">
    <section id="tagsSec" aria-labelledby="h-tags">
      <div class="headrow">
        <h2 id="h-tags">Tags</h2>
        <select class="filter" id="tagScope" aria-label="Tags to list">
          <option value="area">This area</option>
          <option value="all">All areas</option>
        </select>
      </div>
      <div class="scroll" id="tagList"></div>
      <p class="empty" id="noTagsMsg">No position received yet.</p>
    </section>

    <section id="resSec" aria-labelledby="h-res">
      <div class="headrow">
        <h2 id="h-res">Engine answers</h2>
        <small>changes to the lists</small>
      </div>
      <div class="scroll" id="resList"></div>
      <p class="empty" id="noRes">No answer yet.</p>
    </section>
  </div>
</main>

<div class="overlay" id="popup" hidden>
  <button class="back" id="popBack" type="button" aria-label="Close"></button>
  <div class="dialog" id="popDialog" role="dialog" aria-labelledby="popTitle">
    <div class="top">
      <div>
        <h3 id="popTitle"></h3>
        <span class="when" id="popWhen"></span>
      </div>
      <button class="close" id="popClose" type="button" aria-label="Close window">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div id="popBody" style="display:flex;flex-direction:column;gap:14px;min-height:0"></div>
  </div>
</div>

<template id="recTpl">
<style>
  :root { --bg:#12161a; --panel:#1a2025; --line:#262e35; --line2:#303a42; --line3:#3a444d; --fg:#e6eaed; --muted:#9aa6b0;
    --accent:#f5a524; --accent-bg:rgba(245,165,36,.10); --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; color-scheme:dark; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px var(--sans); }
  header { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 16px; padding:16px; border-bottom:1px solid var(--line); }

<script id="rec-data" type="application/json">__RECORD_DATA__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('rec-data').textContent);
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const hms = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const dmy = ts => { const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
  const dur = ms => { const s = Math.round(ms / 1000); return (s >= 3600 ? Math.floor(s / 3600) + ' h ' : '') + (s >= 60 ? Math.floor(s % 3600 / 60) + ' min ' : '') + (s % 60) + ' s'; };
  const RAD = Math.PI / 180, WA = 6378137.0, WE2 = 6.69437999014e-3;
  function toWGS84(o, x, y) {
    const th = (o.rotation_deg || 0) * RAD, s = Math.sin(o.lat * RAD), w = 1 - WE2 * s * s;
    const m = WA * (1 - WE2) / (w * Math.sqrt(w)), n = WA / Math.sqrt(w);
    const east = x * Math.cos(th) + y * Math.sin(th), north = -x * Math.sin(th) + y * Math.cos(th);
    return [o.lat + north / m / RAD, o.lon + east / (n * Math.cos(o.lat * RAD)) / RAD];
  }
  const SVGNS = 'http://www.w3.org/2000/svg';
  const svg = (tag, attrs, text) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };

  for (const tg of D.tags) tg.pts = tg.points.map(p => ({ ts: p[0], area: p[1], x: p[2], y: p[3], sigma: p[4], mode: p[5] }));
  const st = { area: (D.areas.find(a => D.tags.some(t => t.pts.some(p => p.area === a.code))) || D.areas[0] || {}).code, view: 'plan', t: D.from, playing: false, hidden: {} };
  const areaOf = c => D.areas.find(a => a.code === c);
  if ((areaOf(st.area) || {}).origin) st.view = 'satellite';   // like the dashboard: a georeferenced area opens on the map
  $('recSite').textContent = D.site;
  $('recSpan').textContent = dmy(D.from) + ' · ' + hms(D.from) + ' to ' + hms(D.to) + ' (' + dur(D.to - D.from) + ') · generated ' + dmy(D.generated) + ' ' + hms(D.generated);
  $('recSlider').min = D.from; $('recSlider').max = D.to; $('recSlider').value = D.from;

  // Where each tag is at time t: interpolated between two positions less than 3 s apart, else the last one
  function where(tg, t) {
    const p = tg.pts; let lo = 0, hi = p.length - 1, i = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (p[m].ts <= t) { i = m; lo = m + 1; } else hi = m - 1; }
    if (i < 0) return null;
    const a = p[i], b = p[i + 1];
    if (b && b.area === a.area && b.ts - a.ts < 3000) { const u = (t - a.ts) / (b.ts - a.ts); return { area: a.area, x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, i, age: 0 }; }
    return { area: a.area, x: a.x, y: a.y, i, age: t - a.ts };
  }
  function trace(tg, t, code) {
    const len = Number($('recTrail').value) * 1000, out = [];
    for (const p of tg.pts) { if (p.ts > t) break; if (p.area === code && (!len || p.ts >= t - len)) out.push(p); }
    return out;
  }

  // Tags: distance, time, areas
  for (const tg of D.tags) {
    let dist = 0;
    for (let i = 1; i < tg.pts.length; i++) { const a = tg.pts[i - 1], b = tg.pts[i]; if (a.area === b.area && b.ts - a.ts < 5000) dist += Math.hypot(b.x - a.x, b.y - a.y); }
    tg.dist = dist; tg.areas = [...new Set(tg.pts.map(p => p.area))];
    const row = document.createElement('label'); row.className = 'tagrow';
    const box = document.createElement('input'); box.type = 'checkbox'; box.checked = true; box.onchange = () => { st.hidden[tg.addr] = !box.checked; draw(); };
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = tg.color;
    const txt = document.createElement('span');
    const b = document.createElement('b'); b.textContent = tg.addr;
    const sm = document.createElement('small');
    sm.textContent = tg.areas.join(', ') + ' · ' + tg.pts.length + ' positions · ' + hms(tg.pts[0].ts) + ' to ' + hms(tg.pts[tg.pts.length - 1].ts) + ' · ' + dist.toFixed(0) + ' m travelled';
    txt.append(b, sm); row.append(box, dot, txt); $('recTags').append(row);
  }

  // Area tabs and background
  for (const a of D.areas) {
    const t = document.createElement('button'); t.className = 'tab'; t.type = 'button'; t.textContent = a.code; t.title = a.name || '';
    t.onclick = () => { st.area = a.code; fitted = ''; draw(); };
    $('recAreas').append(t);
  }
  $('recPlan').onclick = () => { st.view = 'plan'; draw(); };
  $('recSat').onclick = () => { st.view = 'satellite'; draw(); };
  $('recStreets').onclick = () => { st.view = 'streets'; draw(); };
  $('recTrail').onchange = () => draw();
  $('recSlider').oninput = e => { st.t = Number(e.target.value); draw(); };
  $('recPlay').onclick = () => { if (st.t >= D.to) st.t = D.from; st.playing = !st.playing; last = performance.now(); draw(); };

  // Plan: metres, grid, anchors, boundary, traces, tags
  function drawPlan(a) {
    const el = $('recSvg'), W = el.clientWidth, H = el.clientHeight;
    el.replaceChildren();
    if (!W || !H) return;
    const pts = [...a.anchors.map(q => [q.x, q.y])];
    for (const tg of D.tags) for (const p of tg.pts) if (p.area === a.code) pts.push([p.x, p.y]);
    if (!pts.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const w = Math.max(x1 - x0, 10), h = Math.max(y1 - y0, 10), sc = Math.min((W - 110) / w, (H - 70) / h), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const px = (x, y) => [W / 2 + (x - cx) * sc, H / 2 - (y - cy) * sc];
    const step = [0.5, 1, 2, 5, 10, 20, 50, 100, 200].find(s => s * sc >= 48) || 500;
    const g = svg('g', {});
    for (let x = Math.ceil((cx - W / 2 / sc) / step) * step; x <= cx + W / 2 / sc; x += step) { const [sx] = px(x, 0); g.append(svg('line', { x1: sx, y1: 0, x2: sx, y2: H, stroke: '#1f272d' }), svg('text', { x: sx + 3, y: H - 6, fill: '#8593a0', 'font-size': 10.5, 'font-family': 'IBM Plex Mono' }, +x.toFixed(1) + '')); }
    for (let y = Math.ceil((cy - H / 2 / sc) / step) * step; y <= cy + H / 2 / sc; y += step) { const [, sy] = px(0, y); g.append(svg('line', { x1: 0, y1: sy, x2: W, y2: sy, stroke: '#1f272d' }), svg('text', { x: 4, y: sy - 3, fill: '#8593a0', 'font-size': 10.5, 'font-family': 'IBM Plex Mono' }, +y.toFixed(1) + '')); }
    el.append(g);
    if (a.hull.length >= 3) el.append(svg('polygon', { points: a.hull.map(p => px(p[0], p[1]).join(',')).join(' '), fill: 'none', stroke: '#9aa6b0', 'stroke-dasharray': '6 4', 'stroke-width': 1.2 }));
    for (const q of a.anchors) { const [x, y] = px(q.x, q.y); el.append(svg('path', { d: `M${x} ${y - 9}L${x + 8} ${y + 6}H${x - 8}Z`, fill: '#1a2025', stroke: '#e6eaed', 'stroke-width': 1.5 }), svg('text', { x: x + 11, y: y + 4, fill: '#d4dbe0', 'font-size': 12, 'font-family': 'IBM Plex Mono' }, q.id)); }
    for (const tg of D.tags) {
      if (st.hidden[tg.addr]) continue;
      const tr = trace(tg, st.t, a.code);
      if (tr.length > 1) el.append(svg('polyline', { points: tr.map(p => px(p.x, p.y).map(n => n.toFixed(1)).join(',')).join(' '), fill: 'none', stroke: tg.color, 'stroke-width': 2, 'stroke-opacity': .8, 'stroke-linejoin': 'round' }));
      const now = where(tg, st.t);
      if (!now || now.area !== a.code || now.age > 60000) continue;
      const [x, y] = px(now.x, now.y), op = now.age > 5000 ? .45 : 1;
      el.append(svg('circle', { cx: x, cy: y, r: 7, fill: tg.color, stroke: '#12161a', 'stroke-width': 2, opacity: op }), svg('text', { x: x + 11, y: y - 8, fill: tg.color, 'font-size': 12, 'font-weight': 500, 'font-family': 'IBM Plex Mono', opacity: op }, tg.addr));
    }
  }

  // Map: the same marks on satellite or street tiles (needs internet)
  let map = null, base = '', fixedFor = '', fitted = '', layers = {}, fixedLayer = null, live = null;
  function drawGeo(a) {
    if (!window.L) { $('recMap').textContent = 'The map needs an internet connection.'; return; }
    if (!map) {
      map = L.map('recMap', { maxZoom: 22 });
      const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
      layers.satellite = [L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 22, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' }), L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 22 })];
      layers.streets = [L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 22, attribution: '&copy; OpenStreetMap contributors' })];
      L.control.scale({ metric: true, imperial: false }).addTo(map);
    }
    map.invalidateSize({ pan: false });
    if (base !== st.view) { for (const k in layers) layers[k].forEach(l => k === st.view ? l.addTo(map) : l.remove()); base = st.view; fixedFor = ''; }
    const ll = (x, y) => toWGS84(a.origin, x, y), ink = st.view === 'streets' ? '#1b2230' : '#ffffff';
    if (fixedFor !== a.code + base) {
      fixedFor = a.code + base;
      if (fixedLayer) fixedLayer.remove();
      fixedLayer = L.layerGroup().addTo(map);
      if (a.hull.length >= 3) L.polygon(a.hull.map(p => ll(p[0], p[1])), { color: ink, weight: 1.5, dashArray: '6 4', fill: false, interactive: false }).addTo(fixedLayer);
      for (const q of a.anchors) L.marker(ll(q.x, q.y), { icon: L.divIcon({ className: 'anc', html: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1.5l6.5 12H1.5z" fill="#1a2025" stroke="#ffffff" stroke-width="1.5"/></svg><span>' + q.id + '</span>', iconSize: null, iconAnchor: [8, 10] }) }).addTo(fixedLayer);
    }
    if (fitted !== a.code) { fitted = a.code; const pts = a.anchors.map(q => ll(q.x, q.y)); if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.2), { maxZoom: 20 }); else map.setView([a.origin.lat, a.origin.lon], 19); }
    if (live) live.remove();
    live = L.layerGroup().addTo(map);
    for (const tg of D.tags) {
      if (st.hidden[tg.addr]) continue;
      const tr = trace(tg, st.t, a.code);
      if (tr.length > 1) L.polyline(tr.map(p => ll(p.x, p.y)), { color: tg.color, weight: 3, opacity: .85, interactive: false }).addTo(live);
      const now = where(tg, st.t);
      if (!now || now.area !== a.code || now.age > 60000) continue;
      const op = now.age > 5000 ? .45 : 1;
      L.circleMarker(ll(now.x, now.y), { radius: 7, color: '#12161a', weight: 2, fillColor: tg.color, fillOpacity: op, opacity: op }).bindTooltip(tg.addr, { permanent: true, direction: 'right', offset: [9, 0], className: 'tagtip' }).addTo(live);
    }
  }

  function draw() {
    const a = areaOf(st.area);
    [...$('recAreas').children].forEach(b => b.className = 'tab' + (b.textContent === st.area ? ' on' : ''));
    const georef = !!(a && a.origin);
    if (!georef) st.view = 'plan';
    $('recSat').disabled = $('recStreets').disabled = !georef;
    $('recPlan').className = st.view === 'plan' ? 'on' : ''; $('recSat').className = st.view === 'satellite' ? 'on' : ''; $('recStreets').className = st.view === 'streets' ? 'on' : '';
    $('recSvg').hidden = st.view !== 'plan'; $('recMap').hidden = st.view === 'plan';
    $('recPlay').textContent = st.playing ? 'Pause' : 'Play';
    $('recSlider').value = st.t; $('recNow').textContent = hms(st.t);
    if (!a) return;
    if (st.view === 'plan') drawPlan(a); else drawGeo(a);
  }
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = now - last; last = now;
    if (st.playing) {
      st.t = Math.min(D.to, st.t + dt * Number($('recSpeed').value));
      if (st.t >= D.to) st.playing = false;
      acc += dt;
      if (acc > 60) { acc = 0; draw(); }   // about 16 frames a second
    }
    requestAnimationFrame(frame);
  }
  new ResizeObserver(() => draw()).observe($('recStage'));
  draw();
  requestAnimationFrame(frame);
})();
</script>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmtTime = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const fmtDate = ts => { const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const upper = v => String(v || '').trim().toUpperCase();
const isAddr = a => /^[0-9A-F]{4}$/.test(a);
const isArea = a => /^[A-Z0-9][A-Z0-9_-]{0,15}$/.test(a);
const parseTs = s => { const t = Date.parse(s); return Number.isFinite(t) ? t : Date.now(); };
const num = v => (v === '' || v === null || v === undefined) ? undefined : Number(v);
const has = v => v !== undefined && v !== null && v !== '';
const fix = (v, n) => Number(v).toFixed(n);

// Test broker: public credentials on purpose (same as messaging.html). For a local broker, open
// rtls.html?url=ws://localhost:9001&user= (an empty user connects without credentials).
const qs = new URLSearchParams(location.search);
const CFG = {
  url: qs.get('url') || 'wss://8ee07f68d14341e282ad0f17e05ca521.s1.eu.hivemq.cloud:8884/mqtt',
  username: qs.has('user') ? qs.get('user') : 'username',
  password: qs.has('pass') ? qs.get('pass') : 'password',
};
// This page plays the software of the RTLS engine. See rtls_engine/README.md for the contract.
const SITE = qs.get('site') || 'lpx/demo/bh';
const TOPIC = {
  config:   SITE + '/rtls/config',          // retained lists in force: {"areas":[...],"sensors":[...]}
  set:      SITE + '/rtls/config/set',      // the page publishes: {"request_id","config":{...}}
  result:   SITE + '/rtls/config/result',   // answer to a set, and changes made to the file by hand
  position: SITE + '/rtls/position/+',      // tag positions
  truth:    SITE + '/rangesim/truth/+',     // true positions of the simulated tags
};
const clientId = 'web-' + Math.random().toString(16).slice(2, 10);
const TRACK_MAX = 7200;            // points kept per tag for the exports: 1 h at 2 per second
const STALE_MS = 10000;            // a tag without a position for this long is drawn faded
const SOURCES = ['planta', 'trena', 'laser', 'celular', 'rtk', 'gnss sensor', 'autocalibração'];
const COLORS = ['#f5a524', '#4cc9f0', '#7be8ab', '#ff9d9d', '#c3a6ff', '#ffd166', '#5ad1c4', '#f28fd1'];
const colorOf = addr => COLORS[parseInt(addr, 16) % COLORS.length];

const state = {
  online: false,
  cfg: null,          // lists in force, from the engine
  draft: null,        // edited copy of the lists, null when nothing changed
  area: '',           // area on the map
  tags: {},           // addr -> { addr, pos, track:[{ts,x,y,area,sigma,mode}], seen }
  truth: {},          // addr -> { x, y, area, ts }
  selected: '',
  results: [],
  pending: null,      // request_id of the last set, until the engine answers
  sendErr: '',
  popup: null,
  armed: '',          // key of a remove button waiting for its second click
  view: null,         // map zoom and pan: { cx, cy, scale } in metres, null = fit
};

const lists = () => state.draft || state.cfg || { areas: [], sensors: [] };
const clone = o => JSON.parse(JSON.stringify(o));
const editable = () => state.draft || (state.draft = clone(state.cfg || { areas: [], sensors: [] }));

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function stamp(ts) {
  const t = el('span', 't');
  t.append(el('b', '', fmtTime(ts)), el('small', '', fmtDate(ts)));
  return t;
}
function kvItem(label, value, cls) {
  const s = el('span', 'it');
  s.append(el('span', '', label));
  if (value instanceof Node) s.append(value); else s.append(el('b', cls || '', value));
  return s;
}
// Rebuild a list only when what it shows changed: a click that spans a rebuild is lost.
const built = {};
function fill(id, sig, build) {
  if (built[id] === sig) return;
  built[id] = sig;
  const c = $(id); c.replaceChildren(); build(c);
}

// ---- Geometry: the same local frame as the engine (internal/geo) ----
const WGS84_A = 6378137.0, WGS84_E2 = 6.69437999014e-3, RAD = Math.PI / 180;
function radii(lat) {
  const s = Math.sin(lat * RAD), w = 1 - WGS84_E2 * s * s;
  return { m: WGS84_A * (1 - WGS84_E2) / (w * Math.sqrt(w)), n: WGS84_A / Math.sqrt(w) };
}
function toLocal(o, lat, lon) {
  const { m, n } = radii(o.lat);
  const east = (lon - o.lon) * RAD * n * Math.cos(o.lat * RAD), north = (lat - o.lat) * RAD * m;
  const th = (o.rotation_deg || 0) * RAD;
  return [east * Math.cos(th) - north * Math.sin(th), east * Math.sin(th) + north * Math.cos(th)];
}
// Inverse of toLocal: metres in the frame of an area to latitude and longitude.
function toWGS84(o, x, y) {
  const th = (o.rotation_deg || 0) * RAD;
  const east = x * Math.cos(th) + y * Math.sin(th), north = -x * Math.sin(th) + y * Math.cos(th);
  const { m, n } = radii(o.lat);
  return [o.lat + north / m / RAD, o.lon + east / (n * Math.cos(o.lat * RAD)) / RAD];
}
const areaOf = code => lists().areas.find(a => upper(a.area) === code);
// Position of a sensor in the frame of its area, or null.
function sensorXY(s) {
  if (has(s.x) && has(s.y)) return [Number(s.x), Number(s.y)];
  const a = areaOf(upper(s.area));
  if (has(s.lat) && has(s.lon) && a && a.origin) return toLocal(a.origin, Number(s.lat), Number(s.lon));
  return null;
}
const areaCodes = () => lists().areas.map(a => upper(a.area)).filter(Boolean).sort();

// ---- Render ----
let frame = 0;
function render() { if (!frame) frame = requestAnimationFrame(() => { frame = 0; draw(); }); }

function draw() {
  const L = lists();
  const codes = areaCodes();
  if (!codes.includes(state.area)) state.area = codes[0] || '';
  $('siteName').textContent = SITE;

  // Areas
  const changedArea = a => state.draft && state.cfg && JSON.stringify(state.cfg.areas.find(x => upper(x.area) === upper(a.area))) !== JSON.stringify(a);
  fill('areaList', JSON.stringify([L.areas, !!state.draft]), list => L.areas.forEach((a, i) => {
    const b = el('button', 'tr cols-area' + (changedArea(a) ? ' changed' : '')); b.type = 'button';
    const n = L.sensors.filter(s => s.role === 'anchor' && upper(s.area) === upper(a.area)).length;
    const name = el('span', 'cell-sub');
    name.append(el('b', '', a.name || '—'), el('small', '', n + ' anchors · tags at ' + (has(a.tag_height_m) ? a.tag_height_m : 1.5) + ' m' + (a.origin ? ' · georeferenced' : '')));
    const st = a.enabled === false ? el('span', 'pill grey', 'off') : el('span');
    b.append(el('span', 'cell-mono', upper(a.area)), name, st);
    b.onclick = () => openArea(i);
    list.append(b);
  }));
  $('noAreas').hidden = L.areas.length > 0;

  // Sensors grouped under their area, presence sensors last
  const changedSensor = s => state.draft && state.cfg && JSON.stringify(state.cfg.sensors.find(x => upper(x.id) === upper(s.id))) !== JSON.stringify(s);
  fill('sensorList', JSON.stringify([L.sensors, L.areas, !!state.draft]), list => {
    const groups = areaCodes().map(c => ({ key: c, title: c, sub: (areaOf(c) || {}).name || '', items: [] }));
    const presence = { key: '', title: 'Presence', sub: 'not in an area', items: [] };
    const byKey = Object.fromEntries(groups.map(g => [g.key, g]));
    L.sensors.forEach((s, i) => {
      const k = s.role === 'anchor' ? upper(s.area) : '';
      if (!k) { presence.items.push({ s, i }); return; }
      if (!byKey[k]) groups.push(byKey[k] = { key: k, title: k, sub: 'area not in the list', items: [] });   // the engine will refuse it
      byKey[k].items.push({ s, i });
    });
    for (const g of [...groups, presence]) {
      if (!g.items.length) continue;
      const h = el('div', 'group-head');
      h.append(el('b', '', g.title), el('small', '', [g.sub, g.items.length + (g.items.length === 1 ? ' sensor' : ' sensors')].filter(Boolean).join(' · ')));
      list.append(h);
      g.items.sort((p, q) => String(p.s.id).localeCompare(String(q.s.id))).forEach(({ s, i }) => {
        const b = el('button', 'tr cols-sensor' + (changedSensor(s) ? ' changed' : '')); b.type = 'button';
        const role = s.role === 'anchor' ? el('span', 'pill base', 'anchor') : el('span', 'pill grey', 'presence');
        const pos = el('span', 'cell-sub');
        const where = has(s.x) ? 'x ' + s.x + ' · y ' + s.y : has(s.lat) ? fix(s.lat, 6) + ', ' + fix(s.lon, 6) : 'no position';
        pos.append(el('b', '', where), el('small', '', [s.name, s.source, has(s.z_m) ? 'z ' + s.z_m + ' m' : ''].filter(Boolean).join(' · ')));
        b.append(el('span', 'cell-mono', upper(s.id)), role, pos);
        b.onclick = () => openSensor(i);
        list.append(b);
      });
    }
  });
  $('noSensors').hidden = L.sensors.length > 0;

  // Draft
  const dirty = !!state.draft && JSON.stringify(state.draft) !== JSON.stringify(state.cfg);
  if (state.draft && !dirty && !state.pending) state.draft = null;
  $('draftSummary').textContent = state.pending ? 'Sent. Waiting for the engine...'
    : dirty ? 'Changes not sent yet.' : state.cfg ? 'Lists in force on the engine.' : 'No lists from the engine yet: is it running on ' + SITE + '?';
  $('draftWarn').hidden = !(dirty && state.cfgChangedUnder);
  $('draftWarn').textContent = 'The lists changed on the engine while you were editing: sending replaces them with yours.';
  $('draftErr').hidden = !state.sendErr;
  $('draftErr').textContent = state.sendErr;
  $('sendLists').disabled = !dirty || !state.online || !!state.pending;
  $('discard').disabled = !dirty || !!state.pending;

  // Area tabs
  fill('areaTabs', JSON.stringify([codes, state.area]), tabs => codes.forEach(c => {
    const b = el('button', 'tab' + (c === state.area ? ' on' : ''), c); b.type = 'button';
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', c === state.area);
    const a = areaOf(c); if (a && a.name) b.title = a.name;
    b.onclick = () => { state.area = c; state.view = null; render(); };
    tabs.append(b);
  }));

  // Plan (metric grid) or Map (satellite, streets): the map needs the area origin
  const ar = areaOf(state.area), georef = !!(ar && ar.origin);
  const onMap = georef && (state.mode || 'map') === 'map';
  $('mMap').disabled = !georef;
  $('mMap').title = georef ? 'Satellite and street maps' : 'Set the origin of area ' + (state.area || '') + ' to see it on a map';
  $('mPlan').className = onMap ? '' : 'on';
  $('mMap').className = onMap ? 'on' : '';
  $('map').hidden = onMap;
  $('leaf').hidden = !onMap;
  document.querySelector('.zoom').hidden = onMap;
  if (onMap) drawGeo(ar); else drawMap();
  drawTags();

  // Engine answers
  fill('resList', state.results.map(r => r.key).join(','), list => state.results.forEach(r => {
    const row = el('div', 'tr cols-res');
    const chip = el('span', 'chip ' + (r.ok ? 'ok' : 'bad'), r.ok ? 'OK' : 'ERR');
    const msg = el('span', 'res-msg' + (r.ok ? '' : ' bad'), r.ok ? 'Lists applied' : r.error);
    msg.append(el('small', '', (r.source === 'file' ? 'file changed on the server' : r.mine ? 'sent by this page' : 'sent by another page')
      + (r.warnings && r.warnings.length ? ' · ' + r.warnings.join('; ') : '')));
    row.append(stamp(r.ts), chip, msg);
    list.append(row);
  }));
  $('noRes').hidden = state.results.length > 0;

  drawPopup();
}

// ---- Map ----
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
let mapBox = null;   // last fitted box, for zoom and pan

function mapContent() {
  const code = state.area;
  const anchors = lists().sensors.filter(s => s.role === 'anchor' && upper(s.area) === code)
    .map(s => ({ s, p: sensorXY(s) })).filter(a => a.p);
  const tags = Object.values(state.tags).filter(t => t.pos && t.pos.area === code);
  const truth = Object.entries(state.truth).filter(([, v]) => v.area === code);
  return { anchors, tags, truth };
}

// Convex hull, counter-clockwise (monotone chain): the same boundary the engine uses.
function convexHull(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return [];
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  for (const q of p.slice().reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  const h = lower.slice(0, -1).concat(upper.slice(0, -1));
  return h.length >= 3 ? h : [];
}

function fitBox(c) {
  const pts = [...c.anchors.map(a => a.p), ...c.tags.map(t => [t.pos.x, t.pos.y]), ...c.truth.map(([, v]) => [v.x, v.y])];
  if (!pts.length) return { cx: 0, cy: 0, w: 20, h: 20 };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: Math.max(x1 - x0, 10), h: Math.max(y1 - y0, 10) };
}

function drawMap() {
  const box = $('map').getBoundingClientRect();
  const W = box.width, H = box.height;
  if (!W || !H) return;
  const c = mapContent();
  const fitted = fitBox(c);
  // Room around the content for the labels (anchor ids sit to the right) and the zoom buttons
  const fitScale = Math.max(Math.min((W - 110) / fitted.w, (H - 70) / fitted.h), 0.01);
  const v = state.view || { cx: fitted.cx, cy: fitted.cy, scale: fitScale };
  mapBox = { W, H, v, fitScale };
  const px = (x, y) => [W / 2 + (x - v.cx) * v.scale, H / 2 - (y - v.cy) * v.scale];
  const showLabels = $('tLabels').checked;
  const root = $('map');
  root.replaceChildren();

  // Grid: the smallest round step at least 48 px wide
  const step = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500].find(s => s * v.scale >= 48) || 1000;
  const xMin = v.cx - W / 2 / v.scale, xMax = v.cx + W / 2 / v.scale, yMin = v.cy - H / 2 / v.scale, yMax = v.cy + H / 2 / v.scale;
  const g = svg('g', { stroke: '#1f272d', 'stroke-width': 1 });
  for (let x = Math.ceil(xMin / step) * step; x <= xMax; x += step) {
    const [sx] = px(x, 0);
    g.append(svg('line', { x1: sx, y1: 0, x2: sx, y2: H, stroke: Math.abs(x) < 1e-9 ? '#3a444d' : '#1f272d' }));
    if (showLabels) g.append(svg('text', { x: sx + 3, y: H - 6, fill: '#8593a0', 'font-size': 10.5, 'font-family': 'IBM Plex Mono', stroke: 'none' }, +x.toFixed(1) + ''));
  }
  for (let y = Math.ceil(yMin / step) * step; y <= yMax; y += step) {
    const [, sy] = px(0, y);
    g.append(svg('line', { x1: 0, y1: sy, x2: W, y2: sy, stroke: Math.abs(y) < 1e-9 ? '#3a444d' : '#1f272d' }));
    if (showLabels) g.append(svg('text', { x: 4, y: sy - 3, fill: '#8593a0', 'font-size': 10.5, 'font-family': 'IBM Plex Mono', stroke: 'none' }, +y.toFixed(1) + ''));
  }
  root.append(g);
  $('gridNote').textContent = 'grid ' + step + ' m';

  // North arrow when the area is georeferenced: north is (−sin θ, cos θ) in the local frame
  const a = areaOf(state.area);
  if (a && a.origin) {
    const th = (a.origin.rotation_deg || 0) * RAD, nx = -Math.sin(th), ny = Math.cos(th);
    const ox = W - 70, oy = 60, L = 22;
    const ng = svg('g', { stroke: '#9aa6b0', 'stroke-width': 1.5, fill: 'none' });
    ng.append(svg('line', { x1: ox - nx * L / 2, y1: oy + ny * L / 2, x2: ox + nx * L / 2, y2: oy - ny * L / 2 }));
    ng.append(svg('circle', { cx: ox + nx * L / 2, cy: oy - ny * L / 2, r: 2.5, fill: '#9aa6b0' }));
    ng.append(svg('text', { x: ox + nx * (L / 2 + 10) - 4, y: oy - ny * (L / 2 + 10) + 4, fill: '#9aa6b0', stroke: 'none', 'font-size': 11, 'font-weight': 600 }, 'N'));
    root.append(ng);
  }

  // Boundary: the hull of the anchors. The engine declines positions more than AREA_MARGIN_M (2 m) outside it.
  const hullPts = convexHull(c.anchors.map(a => a.p));
  if (hullPts.length >= 3) root.append(svg('polygon', { points: hullPts.map(p => px(p[0], p[1]).map(n => n.toFixed(1)).join(',')).join(' '), fill: 'none', stroke: '#5d6973', 'stroke-width': 1.2, 'stroke-dasharray': '6 4' }));

  // Tracks
  if ($('tTracks').checked) {
    for (const t of c.tags) {
      // Only the last seconds chosen, counted back from the tag's own last position
      const since = (t.track.length ? t.track[t.track.length - 1].ts : 0) - Number($('trailLen').value) * 1000;
      const pts = t.track.filter(p => p.area === state.area && p.ts >= since).map(p => px(p.x, p.y).map(n => n.toFixed(1)).join(','));
      if (pts.length > 1) root.append(svg('polyline', { points: pts.join(' '), fill: 'none', stroke: colorOf(t.addr), 'stroke-width': t.addr === state.selected ? 2 : 1.2, 'stroke-opacity': t.addr === state.selected ? .8 : .4, 'stroke-linejoin': 'round' }));
    }
  }

  // Anchors
  for (const { s, p } of c.anchors) {
    const [x, y] = px(p[0], p[1]);
    const ag = svg('g', {});
    ag.append(svg('path', { d: `M${x} ${y - 9}L${x + 8} ${y + 6}H${x - 8}Z`, fill: '#1a2025', stroke: '#9aa6b0', 'stroke-width': 1.5 }));
    if (showLabels) ag.append(svg('text', { x: x + 11, y: y + 4, fill: '#d4dbe0', 'font-size': 12, 'font-family': 'IBM Plex Mono' }, upper(s.id)));
    ag.append(svg('title', {}, upper(s.id) + (s.name ? ' · ' + s.name : '') + '\nx ' + p[0].toFixed(2) + ' m, y ' + p[1].toFixed(2) + ' m, z ' + (s.z_m ?? '?') + ' m'));
    root.append(ag);
  }

  // Simulator truth, joined to the estimate
  if ($('tTruth').checked) {
    for (const [addr, tv] of c.truth) {
      const [x, y] = px(tv.x, tv.y);
      const t = state.tags[addr];
      if (t && t.pos && t.pos.area === state.area) {
        const [ex, ey] = px(t.pos.x, t.pos.y);
        root.append(svg('line', { x1: x, y1: y, x2: ex, y2: ey, stroke: '#e6eaed', 'stroke-opacity': .35, 'stroke-dasharray': '2 3' }));
      }
      root.append(svg('circle', { cx: x, cy: y, r: 5, fill: 'none', stroke: '#e6eaed', 'stroke-opacity': .7, 'stroke-dasharray': '2 2' }));
    }
  }

  // Tags
  const now = Date.now();
  for (const t of c.tags.slice().sort((p, q) => (p.addr === state.selected) - (q.addr === state.selected))) {
    const p = t.pos, col = colorOf(t.addr), sel = t.addr === state.selected;
    const [x, y] = px(p.x, p.y);
    const tg = svg('g', { opacity: now - t.seen > STALE_MS ? .45 : 1, style: 'cursor:pointer' });
    if ($('tEllipses').checked && p.ellipse) {
      const rx = Math.max(p.ellipse.a * v.scale, 1), ry = Math.max(p.ellipse.b * v.scale, 1);
      tg.append(svg('ellipse', { cx: x, cy: y, rx, ry, transform: `rotate(${-p.ellipse.angle_deg} ${x} ${y})`, fill: col, 'fill-opacity': .12, stroke: col, 'stroke-opacity': .5 }));
    }
    if (sel) tg.append(svg('circle', { cx: x, cy: y, r: 11, fill: 'none', stroke: '#f5a524', 'stroke-width': 2 }));
    tg.append(svg('circle', { cx: x, cy: y, r: 6, fill: col, stroke: '#12161a', 'stroke-width': 1.5 }));
    if (showLabels || sel) tg.append(svg('text', { x: x + 10, y: y - 8, fill: col, 'font-size': 12, 'font-weight': 500, 'font-family': 'IBM Plex Mono' }, t.addr));
    tg.append(svg('title', {}, t.addr + ' · ' + p.mode + '\nx ' + p.x + ' m, y ' + p.y + ' m · σ ' + p.sigma_m + ' m'));
    tg.addEventListener('click', ev => { ev.stopPropagation(); select(t.addr); });
    root.append(tg);
  }

  $('mapHint').textContent = !state.area ? 'No area in the lists yet.'
    : c.anchors.length ? (c.tags.length ? '' : 'No tag in ' + state.area + ' yet.')
    : 'Area ' + state.area + ' has no anchor with a position.';
}

// ---- Map background: satellite and street tiles, like a navigation app ----
let leaf = null;
const geo = { area: '', sig: '', fixed: null, live: null, lastLive: 0, timer: 0, size: '' };
function ensureLeaf() {
  if (leaf) return;
  leaf = L.map('leaf', { zoomControl: true, maxZoom: 22, attributionControl: true });
  const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  const sat = L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 22, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' });
  const names = L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 22 });
  const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 22, attribution: '&copy; OpenStreetMap contributors' });
  sat.addTo(leaf); names.addTo(leaf);
  L.control.layers({ 'Satellite': sat, 'Streets': streets }, { 'Place names': names }, { position: 'topright' }).addTo(leaf);
  L.control.scale({ metric: true, imperial: false }).addTo(leaf);
}

function drawGeo(a) {
  ensureLeaf();
  const box = $('leaf').getBoundingClientRect(), size = box.width + 'x' + box.height;
  if (size !== geo.size) { geo.size = size; leaf.invalidateSize({ pan: false }); }
  const o = a.origin, code = state.area, c = mapContent();
  const ll = (x, y) => toWGS84(o, x, y);
  const labels = $('tLabels').checked;

  // Anchors and boundary: rebuilt only when the lists, the area or the labels change
  const sig = JSON.stringify([code, o, c.anchors.map(q => [q.s.id, q.p, q.s.z_m]), labels]);
  if (sig !== geo.sig) {
    geo.sig = sig;
    if (geo.fixed) geo.fixed.remove();
    geo.fixed = L.layerGroup().addTo(leaf);
    const hullPts = convexHull(c.anchors.map(q => q.p));
    if (hullPts.length >= 3) L.polygon(hullPts.map(p => ll(p[0], p[1])), { color: '#ffffff', weight: 1.5, opacity: .85, dashArray: '6 4', fill: false, interactive: false }).addTo(geo.fixed);
    for (const { s, p } of c.anchors) {
      const html = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1.5l6.5 12H1.5z" fill="#1a2025" stroke="#ffffff" stroke-width="1.5"/></svg>' + (labels ? '<span>' + upper(s.id) + '</span>' : '');
      L.marker(ll(p[0], p[1]), { icon: L.divIcon({ className: 'anc-label', html, iconSize: null, iconAnchor: [8, 10] }), keyboard: false,
        title: upper(s.id) + (s.name ? ' · ' + s.name : '') + ' · z ' + (s.z_m ?? '?') + ' m' }).addTo(geo.fixed);
    }
  }
  if (geo.area !== code) {                // a new area: frame its anchors, then the user pans and zooms freely
    geo.area = code;
    const pts = c.anchors.map(q => ll(q.p[0], q.p[1]));
    if (pts.length) leaf.fitBounds(L.latLngBounds(pts).pad(0.2), { maxZoom: 20 }); else leaf.setView([o.lat, o.lon], 19);
  }

  // Tags, traces, ellipses, truth: at most 4 redraws a second
  const now = Date.now();
  if (now - geo.lastLive < 250) {
    if (!geo.timer) geo.timer = setTimeout(() => { geo.timer = 0; render(); }, 260);
    return;
  }
  geo.lastLive = now;
  if (geo.live) geo.live.remove();
  geo.live = L.layerGroup().addTo(leaf);
  if ($('tTracks').checked) {
    for (const t of c.tags) {
      const since = (t.track.length ? t.track[t.track.length - 1].ts : 0) - Number($('trailLen').value) * 1000;
      const pts = t.track.filter(q => q.area === code && q.ts >= since).map(q => ll(q.x, q.y));
      const sel = t.addr === state.selected;
      if (pts.length > 1) L.polyline(pts, { color: colorOf(t.addr), weight: sel ? 3 : 2, opacity: sel ? .95 : .7, interactive: false }).addTo(geo.live);
    }
  }
  if ($('tTruth').checked) {
    for (const [addr, tv] of c.truth) {
      const at = ll(tv.x, tv.y), t = state.tags[addr];
      if (t && t.pos && t.pos.area === code) L.polyline([at, ll(t.pos.x, t.pos.y)], { color: '#ffffff', weight: 1, opacity: .6, dashArray: '2 4', interactive: false }).addTo(geo.live);
      L.circleMarker(at, { radius: 6, color: '#ffffff', weight: 1.5, opacity: .9, dashArray: '2 3', fill: false, interactive: false }).addTo(geo.live);
    }
  }
  for (const t of c.tags.slice().sort((p, q) => (p.addr === state.selected) - (q.addr === state.selected))) {
    const p = t.pos, col = colorOf(t.addr), sel = t.addr === state.selected, faded = now - t.seen > STALE_MS;
    if ($('tEllipses').checked && p.ellipse) {
      const ring = [], ph = p.ellipse.angle_deg * RAD;
      for (let k = 0; k < 36; k++) {
        const u = k * 10 * RAD, dx = p.ellipse.a * Math.cos(u), dy = p.ellipse.b * Math.sin(u);
        ring.push(ll(p.x + dx * Math.cos(ph) - dy * Math.sin(ph), p.y + dx * Math.sin(ph) + dy * Math.cos(ph)));
      }
      L.polygon(ring, { color: col, weight: 1, opacity: .7, fillColor: col, fillOpacity: .18, interactive: false }).addTo(geo.live);
    }

// Zoom and pan, by mouse or touch
function zoomBy(f, sx, sy) {
  if (!mapBox) return;
  const { W, H, v } = mapBox;
  sx = sx ?? W / 2; sy = sy ?? H / 2;
  const mx = v.cx + (sx - W / 2) / v.scale, my = v.cy - (sy - H / 2) / v.scale;   // metres under the pointer stay put
  const scale = Math.min(Math.max(v.scale * f, mapBox.fitScale / 20), mapBox.fitScale * 200);
  state.view = { cx: mx - (sx - W / 2) / scale, cy: my + (sy - H / 2) / scale, scale };
  render();
}
$('zoomIn').onclick = () => zoomBy(1.5);
$('zoomOut').onclick = () => zoomBy(1 / 1.5);
$('zoomFit').onclick = () => { state.view = null; render(); };
$('map').addEventListener('wheel', e => {
  e.preventDefault();
  const r = $('map').getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
const pointers = new Map();
let pinch = 0, dragging = false, downAt = null;
// Pan starts only after the pointer moved a few pixels, so a tap on a tag still selects it.
$('map').addEventListener('pointerdown', e => { pointers.set(e.pointerId, [e.clientX, e.clientY]); downAt = [e.clientX, e.clientY]; dragging = false; });
$('map').addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId) || !mapBox) return;
  const prev = pointers.get(e.pointerId);
  if (!dragging && pointers.size === 1 && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5) return;
  if (!dragging) { dragging = true; $('map').setPointerCapture(e.pointerId); }
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) {
    const v = mapBox.v;
    state.view = { cx: v.cx - (e.clientX - prev[0]) / v.scale, cy: v.cy + (e.clientY - prev[1]) / v.scale, scale: v.scale };
    render();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) { const r = $('map').getBoundingClientRect(); zoomBy(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); }
    pinch = d;
  }
});
const endPointer = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = 0; if (!pointers.size) dragging = false; };
$('map').addEventListener('pointerup', endPointer);
$('map').addEventListener('pointercancel', endPointer);

function updateCard(c, t, now) {

  c.area.textContent = p.area;

  c.seen.textContent = fmtTime(t.seen) + ' · ' + Math.round((now - t.seen) / 1000) + ' s';
  c.x.textContent = fix(p.x, 2) + ' m'; c.y.textContent = fix(p.y, 2) + ' m';
  c.sigma.textContent = fix(p.sigma_m, 2) + ' m'; c.speed.textContent = fix(p.speed, 1) + ' m/s';

}

function field(label, input, note) {

function radioPair(name, options, value, onChange) {

// GNSS of the phone: the median of the fixes of a few seconds
function gnssButton(onFix) {
  const wrap = el('div', 'field');
  const b = el('button', 'ghost', 'Use the phone GNSS'); b.type = 'button';
  const note = el('span', 'note', 'Averages 10 s of fixes. Stand still, in open sky, away from metal.');
  b.onclick = () => {
    if (!navigator.geolocation) { note.textContent = 'This browser has no geolocation.'; return; }
    const fixes = [];
    b.disabled = true;
    const id = navigator.geolocation.watchPosition(p => {
      fixes.push(p.coords);
      note.textContent = 'Averaging: ' + fixes.length + ' fixes, last accuracy ±' + Math.round(p.coords.accuracy) + ' m...';
    }, err => { note.textContent = 'GNSS error: ' + err.message; }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    setTimeout(() => {
      navigator.geolocation.clearWatch(id);
      b.disabled = false;
      if (!fixes.length) { note.textContent = 'No fix. Allow the location and try again.'; return; }
      const med = a => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
      const lat = med(fixes.map(f => f.latitude)), lon = med(fixes.map(f => f.longitude)), acc = med(fixes.map(f => f.accuracy));
      note.textContent = fixes.length + ' fixes, median accuracy ±' + acc.toFixed(1) + ' m. Check it before saving.';
      onFix(+lat.toFixed(7), +lon.toFixed(7), acc);
    }, 10000);
  };
  wrap.append(b, note);
  return wrap;
}

function sensorForm(body, idx) {
  const L = lists();
  const s = idx >= 0 ? clone(L.sensors[idx]) : { role: 'anchor', area: state.area || '', source: 'planta' };
  $('popTitle').textContent = idx >= 0 ? 'Sensor ' + upper(s.id) : 'New sensor';
  $('popWhen').textContent = 'Every anchor is a sensor; presence sensors are listed but not trilaterated';
  let role = s.role === 'presence' ? 'presence' : 'anchor';
  let mode = has(s.x) ? 'local' : has(s.lat) ? 'wgs84' : (role === 'anchor' ? 'local' : 'none');

  const id = input(s.id, { cls: 'mono up', placeholder: 'e.g. A001' }); id.maxLength = 4;
  const roleSel = radioPair('role', [['anchor', 'Anchor'], ['presence', 'Presence']], role, v => { role = v; if (role === 'presence' && mode === 'local') mode = 'wgs84'; sync(); });
  const area = select2(areaCodes().map(c => [c, c + (areaOf(c) && areaOf(c).name ? ' · ' + areaOf(c).name : '')]), upper(s.area));
  const areaF = field('Area', area);
  const modeBox = el('div', 'field');
  const x = input(s.x, { type: 'number', step: 'any', mode: 'decimal', placeholder: '0.00' }), y = input(s.y, { type: 'number', step: 'any', mode: 'decimal', placeholder: '0.00' });
  const lat = input(s.lat, { type: 'number', step: 'any', mode: 'decimal', placeholder: '-19.9496790' }), lon = input(s.lon, { type: 'number', step: 'any', mode: 'decimal', placeholder: '-43.9701230' });
  const xy = el('div', 'grid2'); xy.append(field('x (m)', x), field('y (m)', y));
  const ll = el('div', 'grid2'); ll.append(field('Latitude', lat), field('Longitude', lon));
  const llNote = el('span', 'note');
  const z = input(s.z_m, { type: 'number', step: 'any', mode: 'decimal', placeholder: 'e.g. 10' });
  const sigma = input(s.sigma_m, { type: 'number', step: 'any', mode: 'decimal', placeholder: 'default 0.1 (x/y) or 3 (lat/lon)' });
  const source = select2([['', '—'], ...SOURCES.map(v => [v, v])], s.source || '');
  const name = input(s.name, { placeholder: 'optional, e.g. Gate 2' });
  const gnss = gnssButton((la, lo, acc) => {
    lat.value = la; lon.value = lo; source.value = 'celular';
    if (!has(sigma.value)) sigma.value = Math.max(1, +acc.toFixed(1));
    mode = 'wgs84'; sync();
  });
  const zs = el('div', 'grid2'); zs.append(field('Height z (m)', z, 'Antenna height above the floor of the area, by hand.'), field('Position σ (m)', sigma));
  const modeSel = el('div');

  function sync() {
    roleSel.querySelectorAll('input').forEach((r, i) => { r.checked = (i === 0) === (role === 'anchor'); r.parentElement.className = 'opt' + (r.checked ? ' on' : ''); });
    areaF.hidden = role !== 'anchor';
    const opts = role === 'anchor' ? [['local', 'Metres (x, y)'], ['wgs84', 'Lat / Lon']] : [['wgs84', 'Lat / Lon'], ['none', 'No position']];
    if (!opts.some(o => o[0] === mode)) mode = opts[0][0];
    modeSel.replaceChildren(radioPair('mode', opts, mode, v => { mode = v; sync(); }));
    xy.hidden = mode !== 'local';
    ll.hidden = gnss.hidden = mode !== 'wgs84';
    const a = areaOf(area.value);
    llNote.hidden = !(role === 'anchor' && mode === 'wgs84');
    llNote.textContent = a && a.origin ? 'Converted to metres with the origin of area ' + area.value + '.' : 'Area ' + (area.value || '?') + ' has no origin: set it in the area before using lat/lon.';
  }
  area.onchange = sync;
  modeBox.append(el('span', 'lab', 'Position'), modeSel, xy, ll, llNote, gnss);

  const [prob, row] = buttons(() => {
    const out = { id: upper(id.value), role };
    if (!isAddr(out.id)) return 'ID: 4 hex digits, for example A001.';
    if (L.sensors.some((o, i) => i !== idx && upper(o.id) === out.id)) return 'Sensor ' + out.id + ' is already in the list.';
    if (role === 'anchor') { if (!area.value) return 'An anchor needs an area: create one first.'; out.area = area.value; }
    if (has(name.value.trim())) out.name = name.value.trim();
    if (mode === 'local') {
      if (!has(x.value) || !has(y.value)) return 'Fill x and y.';
      out.x = num(x.value); out.y = num(y.value);
    } else if (mode === 'wgs84') {
      if (!has(lat.value) || !has(lon.value)) return 'Fill latitude and longitude.';
      out.lat = num(lat.value); out.lon = num(lon.value);
      if (Math.abs(out.lat) > 90 || Math.abs(out.lon) > 180) return 'Latitude or longitude out of range.';
    }
    if (has(z.value)) out.z_m = num(z.value);
    else if (role === 'anchor') return 'An anchor needs its height z.';
    if (has(sigma.value)) out.sigma_m = num(sigma.value);
    if (source.value) out.source = source.value;
    const d = editable();
    if (idx >= 0) d.sensors[idx] = out; else d.sensors.push(out);
    state.sendErr = '';
    return '';
  }, 'rm-s' + idx, idx >= 0 ? () => { editable().sensors.splice(idx, 1); return ''; } : null);

  const top = el('div', 'grid2'); top.append(field('ID', id), field('Name', name));
  body.append(top, field('Role', roleSel), areaF, modeBox, zs, field('Source of the position', source), prob, row);
  sync();
}

function areaForm(body, idx) {

  const gnss = gnssButton((la, lo) => { olat.value = la; olon.value = lo; });
  const top = el('div', 'grid2'); top.append(field('Code', code), field('Name', name));
  const mid = el('div', 'grid2'); mid.append(field('Tag height (m)', th, 'Tags of this area, above its floor.'), field('Trilateration', en));
  const geo = el('div', 'field');
  geo.append(el('span', 'lab', 'Georeference (optional)'), og,
    el('span', 'note', 'Origin: lat/lon of the local (0, 0). Rotation: azimuth of the local +y axis, clockwise from north (0: x east, y north). Needed for anchors given in lat/lon, and for lat/lon in the output.'), gnss);

  const [prob, row] = buttons(() => {
    const out = { area: upper(code.value) };

    if (has(name.value.trim())) out.name = name.value.trim();

    }
    if (!enabled) out.enabled = false;
    const d = editable();

      d.areas[idx] = out;

    } else d.areas.push(out);
    state.sendErr = '';
    if (!state.area) state.area = out.area;

  }, 'rm-a' + idx, idx >= 0 ? () => {
    const n = editable().sensors.filter(s => upper(s.area) === oldCode).length;

    editable().areas.splice(idx, 1);

  } : null);
  body.append(top, mid, geo, prob, row);
}
function nextAreaCode() {
  const used = new Set(areaCodes());

}

  const L0 = lists();
  const tags = Object.values(state.tags).filter(t => t.track.length > 1).sort((a, b) => a.addr < b.addr ? -1 : 1)
    .map(t => ({ addr: t.addr, color: colorOf(t.addr), points: t.track.map(p => [p.ts, p.area, p.x, p.y, p.sigma, p.mode]) }));
  if (!tags.length) { $('exportRec').textContent = 'No movement yet'; setTimeout(() => { $('exportRec').textContent = 'Record .html'; }, 2000); return; }
  const areas = areaCodes().map(code => {
    const a = areaOf(code) || {};
    const anchors = L0.sensors.filter(s => s.role === 'anchor' && upper(s.area) === code).map(s => ({ s, p: sensorXY(s) })).filter(q => q.p)
      .map(q => ({ id: upper(q.s.id), x: +q.p[0].toFixed(3), y: +q.p[1].toFixed(3), z: q.s.z_m }));
    return { code, name: a.name || '', origin: a.origin || null, anchors, hull: convexHull(anchors.map(q => [q.x, q.y])) };
  });
  const times = tags.flatMap(t => [t.points[0][0], t.points[t.points.length - 1][0]]);
  const data = { site: SITE, generated: Date.now(), from: Math.min(...times), to: Math.max(...times), areas, tags };
  const json = JSON.stringify(data).replace(/</g, '\\u003c');   // nothing in the data can close the script
  const head = '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>Movement record · ' + SITE + '</title>\n'
    + '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">\n'
    + '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">\n'
    + '<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>\n</head>\n<body>\n';
  const html = head + $('recTpl').innerHTML.replace('__RECORD_DATA__', () => json) + '\n</body>\n</html>\n';
  const d = new Date(data.from);
  const name = 'movement-record-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.html';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

function exportTrack(addr) {
  const t = state.tags[addr];
  if (!t) return;
  const rows = ['time,area,x_m,y_m,sigma_m,mode,lat,lon'];
  t.track.forEach(p => rows.push([new Date(p.ts).toISOString(), p.area, p.x, p.y, p.sigma, p.mode, p.lat ?? '', p.lon ?? ''].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\r\n') + '\r\n'], { type: 'text/csv' }));
  a.download = 'track-' + addr + '-' + new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '') + '.csv';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- MQTT ----
function setConn(text, cls) {
  $('connText').textContent = text;
  $('conn').className = 'conn ' + (cls || '');
}
const opts = { clientId, reconnectPeriod: 5000 };
if (CFG.username) { opts.username = CFG.username; opts.password = CFG.password; }
const client = mqtt.connect(CFG.url, opts);
client.on('connect', () => {
  state.online = true;
  setConn('Connected to broker', 'ok');
  client.subscribe([TOPIC.config, TOPIC.result], { qos: 1 });
  client.subscribe([TOPIC.position, TOPIC.truth], { qos: 0 });
  render();
});
client.on('reconnect', () => { state.online = false; setConn('Reconnecting to broker...', 'err'); render(); });
client.on('offline', () => { state.online = false; setConn('No connection to broker', 'err'); render(); });
client.on('close', () => { state.online = false; render(); });
client.on('error', err => { setConn('Error: ' + err.message, 'err'); });

const POS_PREFIX = SITE + '/rtls/position/', TRUTH_PREFIX = SITE + '/rangesim/truth/';
let resSeq = 0;
client.on('message', (topic, payload) => {
  let o; try { o = JSON.parse(payload.toString()); } catch (e) { return; }
  if (!o || typeof o !== 'object') return;
  if (topic.startsWith(POS_PREFIX)) {
    const addr = upper(o.tag_addr || topic.slice(POS_PREFIX.length));
    if (!isAddr(addr) || !Number.isFinite(o.x) || !Number.isFinite(o.y)) return;
    const t = state.tags[addr] || (state.tags[addr] = { addr, track: [] });
    t.pos = o; t.seen = Date.now();
    const ts = parseTs(o.t);
    const last = t.track[t.track.length - 1];
    if (!last || ts >= last.ts) {
      t.track.push({ ts, x: o.x, y: o.y, area: o.area, sigma: o.sigma_m, mode: o.mode, lat: o.lat, lon: o.lon });
      if (t.track.length > TRACK_MAX) t.track.splice(0, t.track.length - TRACK_MAX);
    }
    if (!state.area) state.area = o.area;
  } else if (topic.startsWith(TRUTH_PREFIX)) {
    const addr = upper(o.tag_addr || topic.slice(TRUTH_PREFIX.length));
    if (isAddr(addr) && Number.isFinite(o.x)) state.truth[addr] = { x: o.x, y: o.y, area: o.area, ts: parseTs(o.t) };
  } else if (topic === TOPIC.config) {
    const next = { areas: Array.isArray(o.areas) ? o.areas : [], sensors: Array.isArray(o.sensors) ? o.sensors : [] };
    if (state.draft && state.cfg && !state.pending && JSON.stringify(next) !== JSON.stringify(state.cfg)) state.cfgChangedUnder = true;
    state.cfg = next;
  } else if (topic === TOPIC.result) {
    const mine = !!o.request_id && o.request_id === state.pending;
    state.results = [{ key: ++resSeq, ts: parseTs(o.at), ok: !!o.ok, error: o.error || '', source: o.source || '', warnings: o.warnings || [], mine }, ...state.results].slice(0, 50);
    if (mine) {
      state.pending = null;
      if (o.ok) state.draft = null; else state.sendErr = o.error || 'Refused by the engine.';
    }
  } else return;
  render();
});

render();
</script>
</body>
</html>
